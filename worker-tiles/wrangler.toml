# Cloudflare Worker for serving PMTiles from R2.
#
# account_id is read from the CLOUDFLARE_ACCOUNT_ID env var — not stored here.
#
# To deploy:  cd worker-tiles && npx wrangler deploy
# To tail:    cd worker-tiles && npx wrangler tail

name = "zasqua-tiles"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zasqua-tiles"

[vars]
ALLOWED_ORIGINS = "https://zasqua.org"
CACHE_CONTROL = "public, max-age=86400"
